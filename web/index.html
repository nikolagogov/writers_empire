<!DOCTYPE html>
<html>
<head>
  <base href="${FLUTTER_BASE_HREF}">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Writer's Empire</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Theme color -->
  <meta name="theme-color" content="#1A1207">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <meta name="description" content="Build your writing empire from a bedroom desk to literary immortality.">
  
  <style>
    body {
      margin: 0;
      background-color: #1A1207;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #C9A96E;
      font-size: 24px;
      font-family: 'Georgia', serif;
      background-color: #1A1207;
      flex-direction: column;
    }
    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #C9A96E;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>📖 Loading Writer's Empire...</div>
  </div>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
