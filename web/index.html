<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Writer's Empire</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon-48.png">
  
  <!-- Apple Touch Icon (за iOS) -->
  <link rel="apple-touch-icon" sizes="57x57" href="icons/icon-57.png">
  <link rel="apple-touch-icon" sizes="72x72" href="icons/icon-72.png">
  <link rel="apple-touch-icon" sizes="76x76" href="icons/icon-76.png">
  <link rel="apple-touch-icon" sizes="114x114" href="icons/icon-114.png">
  <link rel="apple-touch-icon" sizes="120x120" href="icons/icon-120.png">
  <link rel="apple-touch-icon" sizes="144x144" href="icons/icon-144.png">
  <link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  
  <!-- Android Chrome -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  
  <!-- Theme color for mobile browsers -->
  <meta name="theme-color" content="#1A1207">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Description -->
  <meta name="description" content="Build your writing empire from a bedroom desk to literary immortality.">
  
  <style>
    body {
      margin: 0;
      background-color: #1A1207;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    #loading {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #C9A96E;
      font-size: 24px;
      font-family: 'Georgia', serif;
      background-color: #1A1207;
      flex-direction: column;
    }
    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #C9A96E;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div>📖 Loading Writer's Empire...</div>
  </div>
  
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
